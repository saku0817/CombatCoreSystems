<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CombatCoreSystems · 管理エディタ</title>
<style>
:root{color-scheme:dark;--bg:#0b111b;--panel:#121d2b;--line:#28394b;--accent:#8fe4bf;--muted:#a0b1c4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e8f0f8;font:14px/1.65 system-ui,sans-serif}aside{position:fixed;width:235px;height:100vh;overflow:auto;background:#101925;border-right:1px solid var(--line);padding:24px 16px}h1{font-size:18px;line-height:1.4;margin:0 0 28px}h1 small{display:block;color:var(--accent);font-size:11px;letter-spacing:3px;margin-top:8px}h2{font-size:26px;margin:0 0 8px}h3{font-size:15px;margin:0 0 14px}p{margin:8px 0 18px}.nav button{width:100%;text-align:left;margin:3px 0;background:transparent;border-color:transparent}.nav button:hover,.nav button.active{background:#213449;color:#b7f3d9}button{font:inherit;cursor:pointer;color:#e8f0f8;background:#203146;border:1px solid #3b5269;border-radius:7px;padding:8px 12px}button:hover{filter:brightness(1.15)}button:disabled{opacity:.5;cursor:wait}button.primary{background:var(--accent);border-color:var(--accent);color:#10291f;font-weight:650}main{margin-left:235px;padding:30px;max-width:1650px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}.count{font-size:32px;color:var(--accent)}.muted{color:var(--muted)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.workspace{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px}.preview{background:linear-gradient(145deg,#1a112c,#0d1424);border:2px solid #54366f;border-radius:6px;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:220px;line-height:1.9}.preview .pname{font-size:18px;font-weight:700}.preview p{margin:9px 0}textarea{display:block;width:100%;height:60vh;min-height:300px;background:#080e17;color:#d3e4d7;border:1px solid #354a60;border-radius:8px;padding:14px;font:13px/1.7 ui-monospace,monospace;tab-size:2;resize:vertical;margin-top:12px}input,select{max-width:100%;background:#0c1522;color:#f3f6fa;border:1px solid #40556e;border-radius:6px;padding:8px;font:inherit}label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.formgrid label{display:grid}.formgrid input{width:100%}.ok{color:#8fe4bf}.err{color:#ff949e}#status{display:block;white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0}.tag{font-size:11px;letter-spacing:1px;color:var(--accent)}details summary{cursor:pointer;color:var(--muted)}#notice{color:#ffb5be}@media(max-width:950px){aside{position:static;width:auto;height:auto}.nav{display:flex;flex-wrap:wrap}.nav button{width:auto}h1{margin-bottom:12px}main{margin:0;padding:18px}.workspace{grid-template-columns:1fr}}
</style></head><body>
<aside><h1>CombatCoreSystems<small>SERVER WORKSHOP</small></h1><nav class="nav" id="nav"></nav><p class="muted">保存前にバックアップを作成。サーバーの設定へ直接反映します。</p></aside>
<main><div id="notice" role="alert"></div><div id="app"></div></main>
<script>
'use strict';
const app=document.getElementById('app'),notice=document.getElementById('notice');
const sections=[['ダッシュボード',null],['YAML生成','generator'],['武器','weapons.yml','weapons'],['装備','equipment.yml','equipment'],['装備セット','sets.yml','sets'],['神心','divine_hearts.yml','divine-hearts'],['Mob','mobs.yml','mobs'],['バニラMob','mobs.yml','vanilla-mobs'],['Boss','bosses.yml','bosses'],['バフ・デバフ','buffs.yml','buffs'],['属性反応','reactions.yml','reactions'],['属性・共通設定','config.yml',null],['ダメージシミュレータ','simulator']];
let info={},file='',root='',etag='',original='',documentTree={},selected='',revision=0,timer;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(url,options){const r=await fetch(url,options),body=await r.text();if(!r.ok){let msg=body;try{msg=JSON.parse(body).error||body}catch{}throw new Error(msg)}return {body,etag:r.headers.get('ETag')}}
function error(e){notice.textContent=String(e.message||e)}
function changed(){return !!document.getElementById('yaml')&&document.getElementById('yaml').value!==original}
window.addEventListener('beforeunload',e=>{if(changed()){e.preventDefault();e.returnValue=''}});
const offline=location.protocol==='file:';
sections.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s[0];b.disabled=offline&&!['generator','simulator'].includes(s[1]);b.onclick=()=>navigate(i).catch(error);document.getElementById('nav').append(b)});
async function navigate(i){if(changed()&&!confirm('保存していない編集を破棄して移動しますか？'))return;clearTimeout(timer);revision++;notice.textContent='';document.querySelectorAll('#nav button').forEach((b,n)=>b.classList.toggle('active',n===i));const s=sections[i];if(!s[1])await dashboard();else if(s[1]==='generator')generator();else if(s[1]==='simulator')simulator();else await section(s[1],s[2],s[0])}
async function refreshSummary(){info=JSON.parse((await request('/api/summary')).body)}
async function dashboard(){await refreshSummary();file='';app.innerHTML='<span class="tag">OVERVIEW</span><h2>ダッシュボード</h2><p class="muted">定義を編集して、サーバーの世界をつくる。</p><div class="cards">'+[['武器','weapons'],['装備','equipment'],['Mob','mobs'],['Boss','bosses'],['バフ・デバフ','buffs'],['属性反応','reactions']].map(([label,key])=>'<div class="card"><span>'+label+'</span><div class="count">'+(info[key]||[]).length+'</div><small class="muted">'+esc((info[key]||[]).slice(0,5).join(' / ')||'未定義')+'</small></div>').join('')+'</div><div class="panel">v'+esc(info.version)+'　·　接続中 '+esc(info.onlinePlayers)+' 人<p class="muted">左のカテゴリから一覧・新規作成・プレビューへ進めます。割合は 0.10 = 10%、倍率は 2.0 = 200% です。</p></div>'}
async function section(name,key,title){const result=await request('/api/file?name='+encodeURIComponent(name));file=name;root=key;etag=result.etag;original=result.body;selected='';app.innerHTML='<span class="tag">CONFIGURATION</span><h2>'+esc(title)+'</h2><p class="muted">一覧からプレビュー対象を選び、YAMLを編集します。保存時に定義全体を検証します。</p><div class="panel"><div class="row"><button id="save" class="primary">検証して保存</button><button id="download">YAMLをダウンロード</button><span class="muted">'+esc(name)+'</span></div><span id="status" role="status"></span>'+(root?'<div class="row"><input id="newId" placeholder="新規ID（英数字・_・-）" aria-label="新規ID"><button id="create">新規作成</button><select id="entry" aria-label="プレビューする定義"></select></div>':'')+'</div><div class="workspace"><div><textarea id="yaml" spellcheck="false" aria-label="設定YAML"></textarea></div><div><h3>リアルタイムプレビュー</h3><p class="muted">選択中の定義から表示。装備中のセット判定など、プレイヤー依存の状態は含みません。</p><div id="live" class="preview"></div><details class="panel"><summary>選択した定義の全キー</summary><pre id="keys" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></details></div></div>';document.getElementById('yaml').value=original;document.getElementById('yaml').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>inspect().catch(error),350)};document.getElementById('save').onclick=()=>save().catch(error);document.getElementById('download').onclick=download;if(root){document.getElementById('create').onclick=()=>create().catch(error);document.getElementById('entry').onchange=e=>{selected=e.target.value;preview()}}await inspect()}
async function inspect(newId){const text=document.getElementById('yaml').value,version=++revision,name=file;let url='/api/document?name='+encodeURIComponent(file);if(newId)url+='&newId='+encodeURIComponent(newId)+'&root='+encodeURIComponent(root);const result=JSON.parse((await request(url,{method:'POST',headers:{'Content-Type':'text/yaml'},body:text})).body);if(version!==revision||file!==name)return;documentTree=result.tree;if(newId){document.getElementById('yaml').value=result.yaml;selected=newId}if(root){const entries=Object.keys(documentTree[root]||{}),select=document.getElementById('entry');select.innerHTML=entries.map(id=>'<option value="'+esc(id)+'">'+esc(id)+'</option>').join('');if(!entries.includes(selected))selected=entries[0]||'';select.value=selected}notice.textContent='';preview()}
async function create(){const id=document.getElementById('newId').value.trim();if(!id)throw new Error('新規IDを入力してください。');await inspect(id);document.getElementById('status').textContent='編集欄に追加しました。「検証して保存」で反映します。'}
async function save(){const b=document.getElementById('save'),status=document.getElementById('status');b.disabled=true;status.textContent='検証・保存中…';const submitted=document.getElementById('yaml').value;try{const result=await request('/api/file?name='+encodeURIComponent(file),{method:'POST',headers:{'Content-Type':'text/yaml','If-Match':etag},body:submitted});etag=result.etag;original=submitted;status.textContent='保存完了。バックアップ: '+JSON.parse(result.body).backup;status.className='ok';await refreshSummary()}catch(e){status.textContent='保存できませんでした: '+e.message;status.className='err'}finally{b.disabled=false}}
function download(){const blob=new Blob([document.getElementById('yaml').value],{type:'text/yaml;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
// Only whitelisted MiniMessage colors and decoration become HTML; all other input is inert.
const colors={black:'#000000',dark_blue:'#0000aa',dark_green:'#00aa00',dark_aqua:'#00aaaa',dark_red:'#aa0000',dark_purple:'#aa00aa',gold:'#ffaa00',gray:'#aaaaaa',dark_gray:'#555555',blue:'#5555ff',green:'#55ff55',aqua:'#55ffff',red:'#ff5555',light_purple:'#ff55ff',yellow:'#ffff55',white:'#ffffff'};
function rich(value){let output='',stack=[];for(const part of String(value??'').split(/(<[^>]*>)/g)){if(part.startsWith('<')){const tag=part.slice(1,-1).toLowerCase();if(tag.startsWith('/')){const end=tag.slice(1),index=stack.lastIndexOf(end);if(index>=0){output+='</span>'.repeat(stack.length-index);stack.length=index}}else{let style=colors[tag]?'color:'+colors[tag]:/^#[0-9a-f]{6}$/.test(tag)?'color:'+tag:tag==='b'||tag==='bold'?'font-weight:bold':tag==='u'||tag==='underlined'?'text-decoration:underline':tag==='i'||tag==='italic'?'font-style:italic':'';if(style){output+='<span style="'+style+'">';stack.push(tag)}else if(tag==='newline'||tag==='br')output+='\n'}}else output+=esc(part)}return output+'</span>'.repeat(stack.length)}
const lines=v=>Array.isArray(v)?v:[v??''];
function preview(){const value=root?(documentTree[root]||{})[selected]:documentTree,live=document.getElementById('live');document.getElementById('keys').textContent=JSON.stringify(value||{},null,2);if(!value){live.textContent='定義がありません。「新規作成」で追加できます。';return}if(!root){live.textContent='属性色\n'+JSON.stringify(value['attribute-colors']||{},null,2)+'\n\nダメージ共通倍率: '+(value.damage?.['global-multiplier']??2);return}let html='<div class="pname">'+rich(value.name||selected)+'</div>';if(value.rarity)html+='<div style="color:'+(['','#fff','#55ff55','#5555ff','#aa00aa','#ffaa00'][Math.min(5,Math.max(1,+value.rarity))])+'">'+'★'.repeat(Math.min(5,Math.max(1,+value.rarity)))+'</div>';if(value.material)html+='<small class="muted">'+esc(value.material)+'</small>';if(value.slot)html+='<p>装備部位：'+esc(({HEAD:'ヘルメット',CHEST:'チェストプレート',LEGS:'レギンス',FEET:'ブーツ',RESONANCE:'共鳴',DIVINE_HEART:'神心'})[value.slot]||value.slot)+'</p>';if(value.category)html+='<p>カテゴリ：'+esc(({MELEE:'近接',RANGED:'遠距離',UNCATEGORIZED:'未指定'})[value.category]||value.category)+'</p>';if(value['base-atk'])html+='<p>武器攻撃力 '+esc(Math.round(value['base-atk']['level-1']||0))+' → '+esc(Math.round(value['base-atk']['level-100']||0))+'</p>';if(value['main-stat'])html+='<p>➽ '+esc(value['main-stat'].type)+' '+esc(value['main-stat']['level-1'])+' → '+esc(value['main-stat']['max-level'])+'</p>';for(const [key,label] of [['talent','天賦'],['skill','スキル'],['ultimate','必殺技'],['two-piece','2セット'],['four-piece','4セット']]){const ability=value[key];if(ability)html+='<p style="color:#adff2f">➽ '+label+' '+rich(ability.name||'')+'</p>'+lines(ability.description).map(s=>rich(s)).join('\n')}for(const t of Object.values(value.talents||{}))html+='<p style="color:#adff2f">➽ '+rich(t.name||'天賦')+'</p>'+lines(t.description).map(rich).join('\n');if(value.stats)html+='<p>HP '+esc(value.stats.hp?.min)+' ～ '+esc(value.stats.hp?.max)+'\nATK '+esc(value.stats.atk?.min)+' ～ '+esc(value.stats.atk?.max)+'</p>';if(value.attributes)html+='<p>'+esc(value.attributes.join(' × '))+' / CT '+esc(value.cooldown)+'秒</p>';html+='<p>'+lines(value.lore).map(rich).join('\n')+'</p>';live.innerHTML=html}
function field(id,label,value,step='1'){return '<label>'+label+'<input id="'+id+'" type="number" step="'+step+'" value="'+value+'"></label>'}
function simulator(){file='';app.innerHTML='<span class="tag">DAMAGE LAB</span><h2>ダメージシミュレータ</h2><p class="muted">複合ダメージの合計 → 防御・共通倍率 → 耐性 → 会心 → 四捨五入。割合は 0.15 = 15% です。</p><div class="panel formgrid">'+field('atk','攻撃力（最終ステータス）',100)+field('hp','最大HP（参照用）',1000)+field('defref','自分の防御力（参照用）',100)+field('bonus','属性ダメージ補正',.15,'.01')+'</div><div class="panel" id="components"></div><div class="panel formgrid">'+field('al','攻撃側レベル',1)+field('dl','防御側レベル',1)+field('defense','敵防御力',0)+field('down','敵防御低下率',0,'.01')+field('ignore','防御無視率の合計',0,'.01')+field('res','敵属性耐性',0,'.01')+field('resdown','属性耐性低下率',0,'.01')+field('global','共通ダメージ倍率',info.globalMultiplier??2,'.1')+field('crit','会心ダメージ補正',.5,'.01')+'<label><span>会心</span><input id="critical" type="checkbox"></label><label><span>属性ダメージ（耐性適用）</span><input id="elemental" type="checkbox" checked></label></div><div class="card"><div id="result" class="count"></div><div id="breakdown" class="muted"></div></div>';document.getElementById('components').innerHTML=[0,1].map(i=>'<div class="row"><label>成分'+(i+1)+' 参照 <select id="ref'+i+'"><option value="atk">ATK</option><option value="hp">HP</option><option value="defref">DEF</option></select></label><label>倍率 <input id="mul'+i+'" type="number" step=".1" value="'+(i?1:2)+'"></label><label><input type="checkbox" id="eb'+i+'" '+(i?'checked':'')+'>この成分に属性補正を適用</label></div>').join('');app.querySelectorAll('input,select').forEach(e=>e.oninput=calc);calc()}
function calc(){const v=id=>Number(document.getElementById(id).value),check=id=>document.getElementById(id).checked;let base=0;for(let i=0;i<2;i++)base+=Math.max(0,v(document.getElementById('ref'+i).value)*v('mul'+i)*(check('eb'+i)?Math.max(0,1+v('bonus')):1));const effective=Math.max(0,v('defense'))*(1-v('down'))*(1-Math.max(0,Math.min(1,v('ignore')))),a=Math.max(1,v('al'))+100,den=a+Math.max(1,v('dl'))+100+effective,coefficient=den<=0?0:a/den,resistance=check('elemental')?Math.min(1,v('res')-v('resdown')):0,damage=base*coefficient*Math.max(0,v('global'))*(1-resistance)*(check('critical')?1+v('crit'):1);document.getElementById('result').textContent=Number.isFinite(damage)?Math.max(0,Math.round(damage)).toLocaleString():'入力値を確認してください';document.getElementById('breakdown').textContent='合計 '+base.toFixed(2)+' × 防御係数 '+coefficient.toFixed(4)+' × 共通倍率 '+v('global')+' × 耐性係数 '+(1-resistance).toFixed(4)+' × 会心倍率 '+(check('critical')?1+v('crit'):1)+'。属性反応・免疫・範囲・ヒット数は別途考慮してください。'}
const generatorTypes={weapon:['武器','weapons.yml','weapons'],equipment:['装備','equipment.yml','equipment'],set:['装備セット','sets.yml','sets'],heart:['神心','divine_hearts.yml','divine-hearts'],mob:['Mob','mobs.yml','mobs'],vanilla:['バニラMob','mobs.yml','vanilla-mobs'],boss:['Boss','bosses.yml','bosses'],buff:['バフ・デバフ','buffs.yml','buffs'],reaction:['属性反応','reactions.yml','reactions']};
const attributes=['PHYSICAL','FIRE','WATER','WIND','THUNDER','MOON'];
const generatorStats=['ATK_FLAT','ATK_PERCENT','HP_FLAT','HP_PERCENT','DEF_FLAT','DEF_PERCENT','CRIT_RATE','CRIT_DAMAGE','DEF_IGNORE','FIRE_DAMAGE','WATER_DAMAGE','WIND_DAMAGE','THUNDER_DAMAGE','MOON_DAMAGE'];
let generatedDocument,generatedMeta;
function textField(id,label,value=''){return '<label>'+esc(label)+'<input id="g-'+id+'" value="'+esc(value)+'"></label>'}
function numberField(id,label,value,step='.01'){return field('g-'+id,label,value,step)}
function choiceField(id,label,options,value){return '<label>'+esc(label)+'<select id="g-'+id+'">'+options.map(x=>'<option '+(x===value?'selected':'')+' value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select></label>'}
function multiField(id,label,value=''){return '<label>'+esc(label)+'<textarea id="g-'+id+'" style="height:100px;min-height:80px" spellcheck="false">'+esc(value)+'</textarea></label>'}
function generator(){file='';generatedDocument=null;app.innerHTML='<span class="tag">YAML BUILDER'+(offline?' · OFFLINE':'')+'</span><h2>YAML生成</h2><p class="muted">フォームから定義を作り、.ymlとしてダウンロードします。生成だけではサーバーへ保存されません。割合は0.10 = 10%です。</p><div class="panel row"><label>生成する種類 <select id="gen-type">'+Object.entries(generatorTypes).map(([id,m])=>'<option value="'+id+'">'+m[0]+'</option>').join('')+'</select></label>'+(offline?'<span class="ok">ネット接続・追加ポート不要</span>':'<a href="/" download="CombatCoreSystems-YamlGenerator.html" style="color:#8fe4bf">オフライン生成ツールを保存</a>')+'</div><div class="panel" id="gen-fields"></div><div class="row"><button class="primary" id="generate">YAMLを生成</button><button id="gen-download" disabled>.ymlをダウンロード</button>'+(offline?'':'<button id="gen-merge" disabled>既存設定の編集欄へ追加</button>')+'</div><p id="gen-status" role="status" class="muted"></p><textarea id="generated" aria-label="生成されたYAML" spellcheck="false" style="height:350px"></textarea>';document.getElementById('gen-type').onchange=generatorFields;document.getElementById('generate').onclick=()=>{try{generateYaml()}catch(e){error(e)}};document.getElementById('gen-download').onclick=()=>downloadText(document.getElementById('generated').value,generatedMeta[1]);if(!offline)document.getElementById('gen-merge').onclick=()=>mergeGenerated().catch(error);generatorFields()}
function generatorFields(){generatedDocument=null;document.getElementById('generated').value='';document.getElementById('gen-download').disabled=true;if(!offline)document.getElementById('gen-merge').disabled=true;const type=document.getElementById('gen-type').value;let html=textField('id','定義ID（英数字・_・-）','new_'+type)+textField('name','表示名（MiniMessage対応）','<white>新しい'+generatorTypes[type][0]+'</white>');if(['weapon','equipment','heart'].includes(type))html+=textField('material','アイテム素材',type==='weapon'?'IRON_SWORD':type==='equipment'?'DIAMOND_CHESTPLATE':'NETHER_STAR')+numberField('rarity','レア度（装備は3～5）',5,'1');if(type==='weapon'){html+=choiceField('category','カテゴリ',['MELEE','RANGED','UNCATEGORIZED'],'UNCATEGORIZED')+numberField('atk1','武器ATK Lv.1',100)+numberField('atk100','武器ATK Lv.100',100)+choiceField('attribute','通常攻撃の属性',attributes,'FIRE')+numberField('bonus','属性ダメージ補正',.15);for(const [prefix,label] of [['skill','スキル'],['ultimate','必殺技']])html+='<label><input type="checkbox" id="g-'+prefix+'-enabled">'+label+'を追加する</label>'+textField(prefix+'-name',label+'名',label)+numberField(prefix+'-multiplier',label+'倍率',prefix==='skill'?1:3)+numberField(prefix+'-cooldown',label+'CT（秒）',prefix==='skill'?10:60)+choiceField(prefix+'-reference',label+'参照値',['ATK','HP','DEF'],'ATK')+multiField(prefix+'-description',label+'説明（1行ずつ）');}
else if(type==='equipment')html+=choiceField('slot','装備部位',['HEAD','CHEST','LEGS','FEET','RESONANCE'],'CHEST')+numberField('max-level','最大レベル',25,'1')+numberField('initial-level','作成時レベル',1,'1')+choiceField('main','メインステータス',generatorStats,'CRIT_DAMAGE')+numberField('main1','メインステ Lv.1',.2)+numberField('mainmax','メインステ 最大Lv',.6)+textField('set','セットID（任意）');
else if(type==='set')html+=choiceField('two-stat','2セットの補正',generatorStats,'CRIT_DAMAGE')+numberField('two-value','2セットの補正値',.16)+textField('two-description','2セット説明','会心ダメージ+16%')+choiceField('four-stat','4セットの補正',generatorStats,'DEF_IGNORE')+numberField('four-value','4セットの補正値',.1)+textField('four-description','4セット説明','敵の防御力を10%無視する。');
else if(['mob','vanilla','boss'].includes(type))html+=textField('entity','エンティティ種類','ZOMBIE')+numberField('level-min','最低レベル',1,'1')+numberField('level-max','最高レベル',1,'1')+numberField('hp-min','最低レベルのHP',50000)+numberField('hp-max','最高レベルのHP',50000)+numberField('atk-min','最低レベルのATK',10)+numberField('atk-max','最高レベルのATK',10)+numberField('def-min','最低レベルのDEF',0)+numberField('def-max','最高レベルのDEF',0)+numberField('exp','討伐時の独自経験値',10,'1')+choiceField('attribute','通常攻撃の属性',attributes,'PHYSICAL');
else if(type==='buff')html+=choiceField('kind','種類',['BUFF','DEBUFF'],'BUFF')+choiceField('target','対象',['SELF','ALLY','ENEMY'],'SELF')+numberField('duration','持続秒数',10)+numberField('stacks','最大スタック数',1,'1')+choiceField('stat','補正ステータス',generatorStats,'ATK_PERCENT')+numberField('value','補正値',.1);
else if(type==='reaction')html+=choiceField('first','付着属性1',attributes.slice(1),'FIRE')+choiceField('second','付着属性2',attributes.slice(1),'WATER')+numberField('first-multiplier','属性1の倍率',.5)+numberField('second-multiplier','属性2の倍率',.5)+numberField('radius','半径（m）',0)+numberField('cooldown','同一対象CT（秒）',2);

function yamlText(value,indent=0){const pad=' '.repeat(indent),scalar=v=>v===null?'null':typeof v==='number'||typeof v==='boolean'?String(v):JSON.stringify(String(v)),key=k=>/^[A-Za-z_][A-Za-z0-9_-]*$/.test(k)?k:JSON.stringify(k);if(Array.isArray(value))return value.length?value.map(v=>v&&typeof v==='object'?(Object.keys(v).length?pad+'-\n'+yamlText(v,indent+2).trimEnd():pad+'- '+(Array.isArray(v)?'[]':'{}')):pad+'- '+scalar(v)).join('\n')+'\n':pad+'[]\n';return Object.entries(value).map(([k,v])=>{const head=pad+key(k)+':';if(v&&typeof v==='object'){if(!Object.keys(v).length)return head+(Array.isArray(v)?' []':' {}');return head+'\n'+yamlText(v,indent+2).trimEnd()}return head+' '+scalar(v)}).join('\n')+'\n'}
function generateYaml(){notice.textContent='';const type=document.getElementById('gen-type').value,get=id=>document.getElementById('g-'+id).value,number=id=>{const v=Number(get(id));if(!Number.isFinite(v)||get(id).trim()==='')throw new Error('数値を確認してください: '+id);return v},description=id=>get(id).split(/\r?\n/).filter(s=>s.trim()),id=get('id');if(!/^[A-Za-z0-9_-]{1,64}$/.test(id))throw new Error('IDは英数字・_・-で1～64文字にしてください。');let entry={name:get('name')};
if(['weapon','equipment','heart'].includes(type)){const rarity=number('rarity');if(!Number.isInteger(rarity)||rarity<1||rarity>5||(type==='equipment'&&rarity<3))throw new Error('レア度は1～5、装備は3～5です。');entry.material=get('material').toUpperCase();entry.rarity=rarity;entry['enchantment-glint']=false;entry.lore=description('lore');}
if(type==='weapon'){entry.category=get('category');entry['base-atk']={'level-1':number('atk1'),'level-100':number('atk100')};entry['equip-level']={min:1,max:100};entry['normal-attack']={attribute:get('attribute')};if(get('attribute')!=='PHYSICAL')entry['attribute-bonus']={type:get('attribute'),value:number('bonus')};for(const kind of ['skill','ultimate'])if(document.getElementById('g-'+kind+'-enabled').checked)entry[kind]={id:id+'_'+kind,name:get(kind+'-name'),description:description(kind+'-description'),reference:get(kind+'-reference'),multiplier:number(kind+'-multiplier'),attribute:get('attribute'),target:'ENEMY',cooldown:number(kind+'-cooldown'),charges:1};}
else if(type==='equipment'){const maximum=number('max-level'),initial=number('initial-level');if(!Number.isInteger(maximum)||maximum<1||maximum>100||!Number.isInteger(initial)||initial<1||initial>maximum)throw new Error('装備のレベルは1～100、初期レベルは最大レベル以下にしてください。');entry.slot=get('slot');entry['max-level']=maximum;entry['initial-level']=initial;entry['main-stat']={type:get('main'),'level-1':number('main1'),'max-level':number('mainmax')};if(get('set'))entry.set=get('set');entry.substats=['ATK_PERCENT','HP_FLAT','CRIT_RATE','CRIT_DAMAGE'];}
else if(type==='set')for(const prefix of ['two','four'])entry[prefix+'-piece']={description:get(prefix+'-description'),modifiers:{[get(prefix+'-stat')]:number(prefix+'-value')}};
else if(['mob','vanilla','boss'].includes(type)){entry['entity-type']=get('entity').toUpperCase();entry.level={min:number('level-min'),max:number('level-max')};if(entry.level.min<1||entry.level.max<entry.level.min)throw new Error('レベル範囲を確認してください。');entry.stats={};for(const stat of ['hp','atk','def']){entry.stats[stat]={min:number(stat+'-min'),max:number(stat+'-max')};if(entry.stats[stat].min<0||entry.stats[stat].max<0||(stat==='hp'&&(entry.stats[stat].min===0||entry.stats[stat].max===0)))throw new Error('HPは正数、ATKとDEFは0以上にしてください。');}entry['custom-exp']=number('exp');entry['drop-custom-exp']=true;entry['native-attribute']=get('attribute');}
else if(type==='buff'){entry.kind=get('kind');entry.target=get('target');entry.duration=number('duration');entry['max-stacks']=number('stacks');entry.reapply='REFRESH';entry.modifiers={flat:{[get('stat')]:number('value')}};}
else if(type==='reaction'){if(get('first')===get('second'))throw new Error('反応には異なる2属性を指定してください。');entry.attributes=[get('first'),get('second')];entry.cooldown=number('cooldown');entry.radius=number('radius');entry['damage-components']={[get('first')]:number('first-multiplier'),[get('second')]:number('second-multiplier')};}
else if(type==='heart'){const attribute=get('attribute');entry.modifiers={[attribute+'_DAMAGE']:number('bonus')};entry.talents={blessing:{name:get('talent'),description:description('talent-description')}};entry.rules={'normal-attack-attribute':attribute};if(document.getElementById('g-reaction-enabled').checked){entry.talents.reaction={name:get('reaction-name'),description:description('reaction-description')};entry.rules['reaction-override']={'source-attribute':attribute,id:get('reaction-id'),name:get('reaction-name'),radius:number('radius'),'cooldown-seconds':number('cooldown'),damage:{reference:'ATK',multiplier:number('multiplier'),attribute},'resistance-down':{attribute,amount:number('resistance-down'),'duration-seconds':number('duration')}};}}
generatedMeta=generatorTypes[type];generatedDocument={'data-version':1,[generatedMeta[2]]:{[id]:entry}};document.getElementById('generated').value=yamlText(generatedDocument);document.getElementById('gen-download').disabled=false;if(!offline)document.getElementById('gen-merge').disabled=false;document.getElementById('gen-status').textContent=generatedMeta[1]+'を生成しました。内容を確認してダウンロードしてください。参照するセットやバフは別のファイルにも定義が必要です。'}
function downloadText(text,name){const url=URL.createObjectURL(new Blob([text],{type:'text/yaml;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function mergeGenerated(){const meta=generatedMeta,text=document.getElementById('generated').value;const parsed=JSON.parse((await request('/api/document?name='+encodeURIComponent(meta[1]),{method:'POST',headers:{'Content-Type':'text/yaml'},body:text})).body).tree;const additions=parsed[meta[2]];if(!additions||typeof additions!=='object')throw new Error('生成した定義ルートが見つかりません。');await section(meta[1],meta[2],meta[0]);const existing=documentTree[meta[2]]||{};for(const id of Object.keys(additions))if(Object.hasOwn(existing,id))throw new Error('ID '+id+' は既に存在します。別のIDで生成してください。');documentTree[meta[2]]={...existing,...additions};document.getElementById('yaml').value=yamlText(documentTree);await inspect();document.getElementById('status').textContent='既存定義を残して追加しました。コメント書式は整形されています。「検証して保存」で反映してください。'}
if(offline)document.querySelector('aside p').textContent='オフライン生成モード。生成したYAMLをレンタルサーバーの管理パネルから配置できます。';
navigate(offline?1:0).catch(error);
