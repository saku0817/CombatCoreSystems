#       - '<gray>「真実だけを辿れば、いつか世界の果てへ着けると思っていた。」</gray>'
#       - '<gray>旅人は幾つもの星を渡り、幾つもの物語を見届けた。</gray>'
#       - '<gray>「歴史とは、起きた出来事の集積ではない。」</gray>'
