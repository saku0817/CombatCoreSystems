name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test and package
        run: mvn --batch-mode clean verify
      - name: Read version
        id: version
        run: echo "value=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"
      - name: Preserve versioned JAR backup
        uses: actions/upload-artifact@v4
        with:
          name: CombatCoreSystems-v${{ steps.version.outputs.value }}
          path: target/CombatCoreSystems-${{ steps.version.outputs.value }}.jar
          if-no-files-found: error
          retention-days: 90
